name: Tes Otomatis

on:
  push:
    branches: [main, utama]
  pull_request:

jobs:
  tes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, fileinfo, dom, xml
          coverage: none

      - name: Pasang dependensi
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan tes
        run: php artisan test
